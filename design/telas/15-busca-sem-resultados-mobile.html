<body>
  <header class="cabecalho-mobile">

    <div class="cabecalho-mobile__acoes">
      <button class="botao-icone botao-icone--toque" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-mobile">

  <main>
    <section class="cabeca-busca-mobile" aria-labelledby="busca-titulo">

      </form>
    </section>

    <section class="vazio" aria-labelledby="vazio-titulo">
      <h2 class="visualmente-oculto" id="vazio-titulo">Nenhum resultado</h2>
      <p class="vazio__texto" role="status">Confira a grafia ou tente palavras mais simples — “uva”, “espumante”, “Serra Gaúcha”.</p>
      <p class="kicker kicker-mobile vazio__rotulo">Comece por aqui</p>
      <div class="chips vazio__chips">
        <a class="chip" href="08-almanaque-indice-mobile.html">Almanaque A–Z</a>
